name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g., v0.5.0)'
        required: true
      run_id:
        description: 'Build run id to use if no build was found for the tag (optional)'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Release Run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"

          # Resolve tag to commit SHA (handles annotated tags)
          REF="$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" --jq '.object.sha')"
          SHA="$(gh api "repos/${{ github.repository }}/git/tags/${REF}" --jq '.object.sha' 2>/dev/null || echo "${REF}")"

          # Find the build workflow run for that commit
          RUN_ID="$(gh api "repos/${{ github.repository }}/actions/workflows/build_packages.yml/runs?head_sha=${SHA}&per_page=1" --jq '.workflow_runs[0].id')"

          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            RUN_ID="${{ github.event.inputs.run_id }}"
          fi

          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "::error::No build found for ${TAG} (commit ${SHA}) and no run_id provided."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Download all zipped artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.resolve.outputs.run_id }}
          pattern: io_scene_bf2-*
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Rename Artifacts to Tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          cd artifacts
          for f in io_scene_bf2-*.zip; do
            mv "$f" "io_scene_bf2-${TAG}-${f##*-}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Release ${{ github.event.inputs.tag }}
          draft: true
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
